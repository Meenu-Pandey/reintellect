services:
  db-init:
    build: ./backend
    command: python -m db.init_schema
    volumes:
      - reintellect_db:/data
    env_file:
      - .env

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - reintellect_db:/data
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reintellect_db:
    driver: local
