[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reintellect-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.*",
    "uvicorn[standard]==0.29.*",
    "ultralytics==8.2.*",
    "aiosqlite==0.20.*",
    "hypothesis==6.100.*",
    "pytest==8.2.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.*",
    "httpx==0.27.*",
    "opencv-python-headless==4.9.*",
    "torch>=2.2,<3",
    "shapely==2.0.*",
    "lapx>=0.5.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "db*", "detection*", "engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
